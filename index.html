function togglePassVis(id) {
  const inp = document.getElementById('pass-'+id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

async function toggleUserAtivo(id) {
  const u = USERS.find(x=>x.id===id);
  if(!u) return;
  u.ativo = !u.ativo;
  await saveUsers(USERS);
  const toggle = document.querySelector(`#usr-row-${id} .toggle-switch`);
  if(toggle) { toggle.classList.toggle('on', u.ativo); }
  const lbl = document.getElementById('ativo-label-'+id);
  if(lbl) lbl.textContent = u.ativo ? 'Ativo' : 'Inativo';
  notify(u.ativo?'✅ Usuário ativado':'🔒 Usuário desativado', `${u.name} ${u.ativo?'pode':'não pode mais'} fazer login.`);
}

async function saveUserPass(id) { saveUserData(id); }

async function saveUserData(id) {
  const u = USERS.find(x=>x.id===id);
  if(!u) return;
  const isAdmin = u.role === 'admin';

  const newName = document.getElementById('name-'+id).value.trim();
  const newUser = isAdmin ? u.user : document.getElementById('user-'+id).value.trim();
  const newPass = document.getElementById('pass-'+id).value.trim();

  if(!newName) { alert('Informe o nome.'); return; }
  if(!isAdmin && !newUser) { alert('Informe o login.'); return; }
  if(!isAdmin && newUser !== u.user) {
    const conflict = USERS.find(x => x.id !== id && x.user === newUser);
    if(conflict) { alert('Este login já está em uso por outro usuário.'); return; }
  }
  if(newPass && newPass.length < 4) { alert('Senha deve ter ao menos 4 caracteres.'); return; }

  u.name = newName;
  if(!isAdmin) u.user = newUser;
  if(newPass) u.pass = newPass;

  // Atualiza currentUser se for o próprio admin editando a si mesmo
  if(currentUser && currentUser.id === id) {
    currentUser.name = u.name;
    document.getElementById('user-name').textContent = u.name;
  }

  await saveUsers(USERS);
  renderUsuarios();
  notify('✅ Usuário salvo!', `${u.name} atualizado com sucesso.`);
}

function openTelasModal(id) {
  const u = USERS.find(x=>x.id===id);
  if(!u) return;
  const checkboxes = Object.entries(TELA_MAP).filter(([k])=>k!=='usuarios').map(([k,v]) =>
    `<label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:5px 0;border-bottom:1px solid var(--border)">
      <input type="checkbox" name="tela-cb" value="${k}" ${u.telas.includes(k)?'checked':''} style="accent-color:var(--orange);width:16px;height:16px">
      <span>${v.icon} ${v.label}</span>
      <small style="margin-left:auto;color:var(--text-muted)">${v.grupo}</small>
    </label>`
  ).join('');

  document.getElementById('modal-title').textContent = `🖥 Telas — ${u.name}`;
  document.getElementById('modal-body').innerHTML = `
    <p class="text-muted mb-16">Selecione quais telas este vendedor pode acessar:</p>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn btn-sm btn-secondary" onclick="document.querySelectorAll('[name=tela-cb]').forEach(c=>c.checked=true)">✅ Marcar todas</button>
      <button class="btn btn-sm btn-secondary" onclick="document.querySelectorAll('[name=tela-cb]').forEach(c=>c.checked=false)">☐ Desmarcar</button>
    </div>
    <div>${checkboxes}</div>
  `;
  document.getElementById('modal-footer').innerHTML = `
    <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="saveTelas('${id}').catch(e=>{notify(\'⚠ Erro\',\'Falha ao salvar. Verifique a conexão.\');})">💾 Salvar Telas</button>
  `;
  openModal();
}

async function saveTelas(id) {
  const u = USERS.find(x=>x.id===id);
  if(!u) return;
  const checked = [...document.querySelectorAll('[name=tela-cb]:checked')].map(c=>c.value);
  if(!checked.includes('dashboard')) checked.unshift('dashboard');
  u.telas = checked;
  await saveUsers(USERS);
  closeModal();
  renderUsuarios();
  notify('✅ Telas salvas!', `Permissões de ${u.name} atualizadas.`);
}

async function saveMarca(id) {
  const nome = document.getElementById('marca-nome').value.trim();
  if(!nome) { alert('Informe o nome da marca.'); return; }
  if(!DATA.marcas) DATA.marcas = [];
  if(id) {
    const m = DATA.marcas.find(x=>x.id===id);
    if(m) { m.nome = nome; m.ativo = document.getElementById('marca-ativo').value==='1'; }
  } else {
    if(DATA.marcas.find(x=>x.nome.toLowerCase()===nome.toLowerCase())) { alert('Marca já cadastrada.'); return; }
    DATA.marcas.push({ id:uid(), nome, ativo:true });
  }
  await saveData('marcas');
  closeModal();
  renderMarcas();
  notify('✅ Marca salva!', nome);
}

  DATA.modelos = (DATA.modelos||[]).filter(x=>x.marca_id!==id);
  await saveData('marcas');
  await saveData('modelos');
  renderMarcas();
  notify('🗑 Marca removida!', '');
}

  openModal();
}

async function saveModelo(id) {
  const marca_id = document.getElementById('modelo-marca').value;
  const nome     = document.getElementById('modelo-nome').value.trim();
  if(!marca_id) { alert('Selecione a marca.'); return; }
  if(!nome)     { alert('Informe o nome do modelo.'); return; }
  if(!DATA.modelos) DATA.modelos = [];
  if(id) {
    const mo = DATA.modelos.find(x=>x.id===id);
    if(mo) { mo.nome=nome; mo.marca_id=marca_id; mo.ativo=document.getElementById('modelo-ativo').value==='1'; }
  } else {
    DATA.modelos.push({ id:uid(), nome, marca_id, ativo:true });
  }
  await saveData('modelos');
  closeModal();
  renderModelos();
  notify('✅ Modelo salvo!', nome);
}

async function deleteModelo(id) {
  if(!confirm('Excluir este modelo?')) return;
  DATA.modelos = DATA.modelos.filter(x=>x.id!==id);
  await saveData('modelos');
  renderModelos();
  notify('🗑 Modelo removido!', '');
}

// ==================== UTILS ====================
function fmt(v) {
  return (v||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
}

function today() {
  return new Date().toISOString().split('T')[0];
}

function openModal() {
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

document.getElementById('modal-overlay').addEventListener('click', e => {
  if(e.target === document.getElementById('modal-overlay')) closeModal();
});

function notify(title, msg) {
  const popup = document.getElementById('notif-popup');
  document.getElementById('notif-title').textContent = title;
  document.getElementById('notif-msg').textContent = msg;
  popup.classList.add('show');
  setTimeout(() => popup.classList.remove('show'), 4000);
}

// ==================== INIT ====================
async function initApp() {
  // Carrega dados (local ou Supabase)
  try {
    await loadData();
  } catch(e) {
    loadDataLocal();
  }
  buildSidebar();
  navigate('dashboard');

  // Check solicitacoes periodicamente (a cada 60s)
  setInterval(() => {
    const pendentes = DATA.solicitacoes.filter(s=>s.status==='pendente' && !s._notified);
    pendentes.forEach(s => {
      const disponivel = DATA.veiculos.find(v =>
        v.status === 'disponivel' &&
        v.marca.toLowerCase() === s.marca.toLowerCase() &&
        (!s.modelo || v.modelo.toLowerCase().includes(s.modelo.toLowerCase()))
      );
      if(disponivel) {
        s._notified = true;
        const cli = DATA.clientes.find(c=>c.id===s.cliente_id);
        notify(`🔔 ${cli?.nome||'Cliente'} tem interesse!`, `${s.marca} ${s.modelo||''} disponível no estoque`);
      }
    });
    updateBadges();
  }, 60000);
}
</script>
